[project]
name = "media-downloader"
version = "0.1.0"
description = "media downloader"
authors = [
    { name = "shift" }
]
dependencies = [
    "beautifulsoup4>=4.15.0",
    "coverage>=7.15.4",
    "cryptography>=50.0.0",
    "emoji>=2.15.0",
    "httpx>=0.28.1",
    "isort>=8.0.1",
    "mock>=5.2.0",
    "orjson>=3.12.0",
    "pillow>=12.3.0",
    "pixivpy3>=3.7.5",
    "plyer>=2.1.0",
    "pycodestyle>=2.14.0",
    "pyside6>=6.11.2",
    "ruff>=0.16.4",
    "xmltodict>=1.0.4",
]
readme = "README.md"
requires-python = ">= 3.12"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.isort]
line_length = 119
multi_line_output = 9

[tool.ruff]
exclude = [
    "__pycache__",
    ".coveragerc",
    ".git",
    ".venv",
    "venv",
]
line-length = 119

[tool.ruff.lint]
fixable = ["ALL"]
select = ["E", "F"]
ignore = ["F401", "F541", "F841"]
preview = true

[tool.ruff.format]
preview = true
quote-style = "double"

[tool.rye]
managed = true
dev-dependencies = []

[tool.rye.scripts]
unittest = "python -m unittest"
cover = {chain = ["coverage run --source src -m unittest discover", "coverage html"]}
copy_to_run = "./copy_to_run.bat"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/media_downloader"]
